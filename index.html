<script type="text/babel">

const { useState, useEffect } = React;

const LOGO_URL =
"https://i.ibb.co/gMQ0KfwD/IMG-20260313-164930.jpg";


/* =========================
   DAYS / TIMES
========================= */

const DAYS = [

  {
    id: "sat",
    name: "السبت",
    times: ["3:00","4:00","5:00","6:00","7:00","8:00","9:00"]
  },

  {
    id: "sun",
    name: "الأحد",
    times: ["12:00","1:00","2:00","3:00"]
  },

  {
    id: "mon",
    name: "الاتنين",
    times: ["3:00","4:00","5:00","6:00","7:00","8:00","9:00"]
  },

  {
    id: "tue",
    name: "الثلاثاء",
    times: ["12:00","1:00","2:00","3:00"]
  },

  {
    id: "wed",
    name: "الأربع",
    times: ["3:00","4:00","5:00","6:00","7:00","8:00","9:00"]
  },

  {
    id: "thu",
    name: "الخميس",
    times: ["3:00","4:00","5:00","6:00","7:00","8:00","9:00"]
  }

];

const SESSION_OPTIONS = [4,8,12,16];


/* =========================
   DATE HELPERS
========================= */

function todayStr() {
  return new Date().toISOString().slice(0,10);
}

const DAY_INDEX = {
  sun: 0,
  mon: 1,
  tue: 2,
  wed: 3,
  thu: 4,
  sat: 6
};

function normalizePhone(phone) {
  return String(phone || "")
    .replace(/\s/g,"")
    .replace(/[^\d+]/g,"");
}

function getDayInfo(id) {
  return DAYS.find(d => d.id === id);
}


/*
  إنشاء الحصص الفعلية للاشتراك
  حسب الأيام المختارة + البداية + النهاية + عدد الحصص
*/
function generateSessions(schedule, startDate, endDate, totalSessions) {

  if (!schedule || !schedule.length || !startDate || !endDate) {
    return [];
  }

  const result = [];

  let current = new Date(startDate + "T00:00:00");
  const end = new Date(endDate + "T00:00:00");

  while (current <= end && result.length < totalSessions) {

    const jsDay = current.getDay();

    schedule.forEach(item => {

      if (result.length >= totalSessions) return;

      if (DAY_INDEX[item.day] === jsDay) {

        const date =
          current.toISOString().slice(0,10);

        result.push({
          id: `${date}_${item.day}_${item.time}`,
          date,
          day: item.day,
          time: item.time,
          status: "pending",
          excuseReason: ""
        });

      }

    });

    current.setDate(current.getDate() + 1);
  }

  return result;
}


/* =========================
   MAIN APP
========================= */

function PopskateApp() {

  const [tab,setTab] = useState("form");

  const [bookings,setBookings] = useState([]);
  const [archive,setArchive] = useState([]);

  const [loading,setLoading] = useState(true);
  const [syncing,setSyncing] = useState(false);
  const [toast,setToast] = useState(null);

  /* FORM */

  const [name,setName] = useState("");
  const [phone,setPhone] = useState("");

  const [schedule,setSchedule] = useState([
    {day:"",time:""},
    {day:"",time:""}
  ]);

  const [amount,setAmount] = useState("");
  const [paid,setPaid] = useState(false);

  const [sessions,setSessions] = useState(null);

  const [startDate,setStartDate] =
    useState(todayStr());

  const [endDate,setEndDate] =
    useState("");

  const [notes,setNotes] = useState("");

  const [errors,setErrors] = useState({});

  const [phoneMatch,setPhoneMatch] = useState(null);

  /* GROUPS */

  const [viewDay,setViewDay] = useState(null);
  const [viewTime,setViewTime] = useState(null);

  /* ARCHIVE */

  const [archiveOpen,setArchiveOpen] = useState(false);


  /* =========================
     TOAST
  ========================= */

  function showToast(message) {

    setToast(message);

    setTimeout(() => {
      setToast(null);
    },3000);

  }


  /* =========================
     FIREBASE LISTENERS
  ========================= */

  useEffect(() => {

    const {
      onValue,
      bookingsRef,
      archiveRef
    } = window.__firebase;

    const unsubscribeBookings =
      onValue(bookingsRef,(snapshot) => {

        const data = snapshot.val();

        if(data) {

          const list =
            Object.entries(data)
            .map(([id,val]) => ({
              id,
              ...val
            }))
            .sort(
              (a,b) =>
              (b.createdAt || 0) -
              (a.createdAt || 0)
            );

          setBookings(list);

        } else {

          setBookings([]);

        }

        setLoading(false);

      });


    const unsubscribeArchive =
      onValue(archiveRef,(snapshot) => {

        const data = snapshot.val();

        if(data) {

          const list =
            Object.entries(data)
            .map(([id,val]) => ({
              id,
              ...val
            }))
            .sort(
              (a,b) =>
              (b.archivedAt || 0) -
              (a.archivedAt || 0)
            );

          setArchive(list);

        } else {

          setArchive([]);

        }

      });


    return () => {

      unsubscribeBookings();
      unsubscribeArchive();

    };

  },[]);


  /* =========================
     PHONE LIVE SEARCH
  ========================= */

  useEffect(() => {

    const p = normalizePhone(phone);

    if(!p || p.length < 4) {

      setPhoneMatch(null);
      return;

    }

    const active =
      bookings.find(
        b => normalizePhone(b.phone) === p
      );

    const archived =
      archive.find(
        b => normalizePhone(b.phone) === p
      );

    if(active) {

      setPhoneMatch({
        type:"active",
        booking:active
      });

    } else if(archived) {

      setPhoneMatch({
        type:"archive",
        booking:archived
      });

    } else {

      setPhoneMatch(null);

    }

  },[phone,bookings,archive]);


  /* =========================
     RESET
  ========================= */

  function resetForm() {

    setName("");
    setPhone("");

    setSchedule([
      {day:"",time:""},
      {day:"",time:""}
    ]);

    setAmount("");
    setPaid(false);
    setSessions(null);

    setStartDate(todayStr());
    setEndDate("");

    setNotes("");

    setErrors({});

    setPhoneMatch(null);

  }


  /* =========================
     UPDATE SCHEDULE
  ========================= */

  function updateSchedule(index,key,value) {

    setSchedule(prev => {

      const copy = [...prev];

      copy[index] = {
        ...copy[index],
        [key]:value
      };

      if(key === "day") {
        copy[index].time = "";
      }

      return copy;

    });

  }


  /* =========================
     REMOVE SECOND DAY
  ========================= */

  function removeSecondDay() {

    setSchedule([
      schedule[0]
    ]);

  }


  /* =========================
     ADD SECOND DAY
  ========================= */

  function addSecondDay() {

    if(schedule.length >= 2) return;

    setSchedule([
      ...schedule,
      {day:"",time:""}
    ]);

  }


  /* =========================
     VALIDATE
  ========================= */

  function validate() {

    const e = {};
    const missing = [];

    if(!name.trim()) {
      e.name=true;
      missing.push("الاسم");
    }

    if(!phone.trim()) {
      e.phone=true;
      missing.push("الموبايل");
    }

    if(!schedule[0]?.day) {
      e.schedule=true;
      missing.push("اليوم الأول");
    }

    if(!schedule[0]?.time) {
      e.schedule=true;
      missing.push("ساعة اليوم الأول");
    }

    if(schedule.length === 2) {

      if(!schedule[1].day) {
        e.schedule=true;
        missing.push("اليوم الثاني");
      }

      if(!schedule[1].time) {
        e.schedule=true;
        missing.push("ساعة اليوم الثاني");
      }

    }

    if(!amount.trim()) {
      e.amount=true;
      missing.push("المبلغ");
    }

    if(!sessions) {
      e.sessions=true;
      missing.push("عدد الحصص");
    }

    if(!startDate) {
      e.startDate=true;
      missing.push("تاريخ البداية");
    }

    if(!endDate) {
      e.endDate=true;
      missing.push("تاريخ النهاية");
    }

    if(
      startDate &&
      endDate &&
      endDate < startDate
    ) {

      e.endDate=true;
      missing.push("تاريخ النهاية يجب أن يكون بعد البداية");

    }

    setErrors(e);

    return {
      valid:Object.keys(e).length === 0,
      missing
    };

  }


  /* =========================
     SUBMIT
  ========================= */

  async function submitBooking(e) {

    e.preventDefault();

    const result = validate();

    if(!result.valid) {

      showToast(
        "محتاج تملى: " +
        result.missing.join("، ")
      );

      return;

    }

    const cleanSchedule =
      schedule.filter(
        x => x.day && x.time
      );

    const generatedSessions =
      generateSessions(
        cleanSchedule,
        startDate,
        endDate,
        sessions
      );

    if(generatedSessions.length < sessions) {

      showToast(
        `الفترة المحددة لا تحتوي على ${sessions} حصص حسب الأيام المختارة`
      );

      return;

    }

    setSyncing(true);

    try {

      const {
        push,
        set,
        bookingsRef
      } = window.__firebase;

      const newRef = push(bookingsRef);

      await set(newRef,{

        name:name.trim(),

        phone:phone.trim(),

        schedule:cleanSchedule,

        amount:amount.trim(),

        paid,

        sessions,

        startDate,

        endDate,

        notes:notes.trim(),

        attendance:generatedSessions,

        createdAt:Date.now()

      });

      showToast("تم تسجيل الاشتراك بنجاح");

      resetForm();

    } catch(err) {

      console.error(err);

      showToast(
        "حصل خطأ: " +
        (err?.message || "جرب تاني")
      );

    }

    setSyncing(false);

  }


  /* =========================
     LOAD CUSTOMER DATA
  ========================= */

  function loadCustomerData(match) {

    const b = match.booking;

    setName(b.name || "");
    setPhone(b.phone || "");

    const loadedSchedule =
      b.schedule ||
      (
        b.day ?
        [{day:b.day,time:b.time}] :
        []
      );

    setSchedule(
      loadedSchedule.length >= 2
      ? loadedSchedule.slice(0,2)
      : [
          loadedSchedule[0] || {day:"",time:""},
          {day:"",time:""}
        ]
    );

    setAmount(b.amount || "");
    setPaid(!!b.paid);
    setSessions(b.sessions || null);

    setStartDate(
      b.startDate || todayStr()
    );

    setEndDate(b.endDate || "");

    setNotes(b.notes || "");

    showToast("تم استدعاء بيانات العميل");

  }


  /* =========================
     UNIQUE PHONE COUNT
  ========================= */

  function uniqueCount(list) {

    const phones = new Set();

    list.forEach(b => {

      const p = normalizePhone(b.phone);

      if(p) phones.add(p);

    });

    return phones.size;

  }


  /* =========================
     GROUP MEMBERS
  ========================= */

  function groupMembers(day,time) {

    return bookings.filter(b => {

      const schedules =
        b.schedule ||
        (
          b.day ?
          [{day:b.day,time:b.time}] :
          []
        );

      return schedules.some(
        s =>
          s.day === day &&
          s.time === time
      );

    });

  }


  /* =========================
     ARCHIVE BOOKING
  ========================= */

  async function archiveBooking(id) {

    const booking =
      bookings.find(b => b.id === id);

    if(!booking) return;

    setSyncing(true);

    try {

      const {
        ref,
        set,
        remove,
        db
      } = window.__firebase;

      const archiveRef =
        ref(db,`archive/${id}`);

      const bookingRef =
        ref(db,`bookings/${id}`);

      await set(
        archiveRef,
        {
          ...booking,
          archivedAt:Date.now()
        }
      );

      await remove(bookingRef);

      showToast(
        "تم نقل المشترك إلى الأرشيف"
      );

    } catch(err) {

      console.error(err);

      showToast(
        "حصل خطأ أثناء الأرشفة"
      );

    }

    setSyncing(false);

  }


  /* =========================
     PERMANENT DELETE ARCHIVE
  ========================= */

  async function permanentlyDeleteArchive(id) {

    const ok =
      window.confirm(
        "هل أنت متأكد من حذف هذا المشترك نهائيًا من الأرشيف؟\n\nلا يمكن التراجع عن هذه العملية."
      );

    if(!ok) return;

    setSyncing(true);

    try {

      const {
        ref,
        remove,
        db
      } = window.__firebase;

      await remove(
        ref(db,`archive/${id}`)
      );

      showToast(
        "تم الحذف النهائي"
      );

    } catch(err) {

      showToast(
        "حصل خطأ أثناء الحذف"
      );

    }

    setSyncing(false);

  }


  /* =========================
     EDIT NOTES
  ========================= */

  async function editNotes(booking) {

    const newNotes =
      window.prompt(
        "تعديل الملاحظات:",
        booking.notes || ""
      );

    if(newNotes === null) return;

    setSyncing(true);

    try {

      const {
        ref,
        set,
        db
      } = window.__firebase;

      const bookingRef =
        ref(
          db,
          `bookings/${booking.id}`
        );

      await set(
        bookingRef,
        {
          ...booking,
          id:undefined,
          notes:newNotes.trim()
        }
      );

      showToast("تم تعديل الملاحظات");

    } catch(err) {

      showToast(
        "حصل خطأ أثناء تعديل الملاحظات"
      );

    }

    setSyncing(false);

  }


  /* =========================
     ATTENDANCE
  ========================= */

  async function updateAttendance(
    booking,
    sessionIndex,
    status
  ) {

    const copied =
      JSON.parse(
        JSON.stringify(
          booking.attendance || []
        )
      );

    if(!copied[sessionIndex]) return;

    let excuseReason =
      copied[sessionIndex].excuseReason || "";

    if(status === "excuse") {

      const reason =
        window.prompt(
          "اكتب سبب الاعتذار:"
        );

      if(reason === null) return;

      excuseReason =
        reason.trim();

    } else {

      excuseReason = "";

    }

    copied[sessionIndex].status = status;
    copied[sessionIndex].excuseReason =
      excuseReason;

    setSyncing(true);

    try {

      const {
        ref,
        set,
        db
      } = window.__firebase;

      const bookingRef =
        ref(
          db,
          `bookings/${booking.id}`
        );

      const clean = {
        ...booking
      };

      delete clean.id;

      clean.attendance = copied;

      await set(
        bookingRef,
        clean
      );

      showToast("تم تحديث حالة الحصة");

    } catch(err) {

      showToast(
        "حصل خطأ في تسجيل الحضور"
      );

    }

    setSyncing(false);

  }


  /* =========================
     RENDER
  ========================= */

  const selectedDayObj =
    schedule[0]?.day
    ? getDayInfo(schedule[0].day)
    : null;


  return (

    <div dir="rtl" style={styles.page}>

      {/* HEADER */}

      <header style={styles.header}>

        <div style={styles.headerInner}>

          <div style={styles.logoRow}>

            <img
              src={LOGO_URL}
              alt="Popskate"
              style={styles.logoMark}
            />

            <div>

              <h1 style={styles.title}>
                Popskate
              </h1>

              <div style={styles.subtitle}>
                نظام حجوزات مركز السكيت
              </div>

            </div>

          </div>

          <div style={styles.syncBadge}>

            <span
              style={{
                ...styles.syncDot,
                background:
                  syncing
                  ? "#E8A33D"
                  : "#3BA776"
              }}
            />

            {syncing
              ? "بيتم الحفظ..."
              : "متزامن"}

          </div>

        </div>


        <div style={styles.tabs}>

          <button
            style={{
              ...styles.tabBtn,
              ...(tab === "form"
                ? styles.tabBtnActive
                : {})
            }}
            onClick={() => setTab("form")}
          >
            + اشتراك جديد
          </button>


          <button
            style={{
              ...styles.tabBtn,
              ...(tab === "groups"
                ? styles.tabBtnActive
                : {})
            }}
            onClick={() => setTab("groups")}
          >
            المجاميع
          </button>

        </div>

      </header>


      <div style={styles.content}>


        {/* =========================
            FORM
        ========================= */}

        {tab === "form" && (

          <form
            onSubmit={submitBooking}
            style={styles.formCard}
          >

            <label style={styles.label}>
              اسم المتدرب
            </label>

            <input
              style={{
                ...styles.input,
                ...(errors.name
                  ? styles.inputError
                  : {})
              }}
              value={name}
              onChange={
                e => setName(e.target.value)
              }
              placeholder="مثال: يوسف أحمد"
            />


            <label style={styles.label}>
              رقم الموبايل
            </label>

            <input
              style={{
                ...styles.input,
                ...(errors.phone
                  ? styles.inputError
                  : {})
              }}
              value={phone}
              onChange={
                e => setPhone(e.target.value)
              }
              placeholder="01xxxxxxxxx"
              type="tel"
            />


            {/* PHONE MATCH */}

            {phoneMatch && (

              <div
                style={{
                  ...styles.phoneMatch,
                  background:
                    phoneMatch.type === "archive"
                    ? "#FFF4DD"
                    : "#EAF7F0"
                }}
              >

                <div>

                  <strong>
                    الرقم موجود بالفعل
                  </strong>

                  <div style={styles.matchName}>
                    {phoneMatch.booking.name}
                  </div>

                  <small>
                    {phoneMatch.type === "archive"
                      ? "المشترك موجود في الأرشيف"
                      : "المشترك موجود في الاشتراكات الحالية"}
                  </small>

                </div>

                <button
                  type="button"
                  style={styles.loadBtn}
                  onClick={() =>
                    loadCustomerData(phoneMatch)
                  }
                >
                  استدعاء البيانات
                </button>

              </div>

            )}


            {/* DAY 1 */}

            <div style={styles.sectionTitle}>
              مواعيد التدريب
            </div>

            <div style={styles.scheduleBox}>

              <div style={styles.scheduleHeader}>
                <strong>اليوم الأول</strong>
              </div>

              <div style={styles.dayGrid}>

                {DAYS.map(d => (

                  <button
                    type="button"
                    key={d.id}
                    style={{
                      ...styles.smallPill,
                      ...(schedule[0]?.day === d.id
                        ? styles.pillActive
                        : {})
                    }}
                    onClick={() =>
                      updateSchedule(
                        0,
                        "day",
                        d.id
                      )
                    }
                  >
                    {d.name}
                  </button>

                ))}

              </div>


              {schedule[0]?.day && (

                <>

                  <label style={styles.miniLabel}>
                    الساعة
                  </label>

                  <div style={styles.dayGrid}>

                    {getDayInfo(
                      schedule[0].day
                    ).times.map(t => (

                      <button
                        type="button"
                        key={t}
                        style={{
                          ...styles.smallPill,
                          ...(schedule[0].time === t
                            ? styles.pillActive
                            : {})
                        }}
                        onClick={() =>
                          updateSchedule(
                            0,
                            "time",
                            t
                          )
                        }
                      >
                        {t}
                      </button>

                    ))}

                  </div>

                </>

              )}

            </div>


            {/* SECOND DAY */}

            {schedule.length === 1 ? (

              <button
                type="button"
                style={styles.addDayBtn}
                onClick={addSecondDay}
              >
                + إضافة يوم ثاني
              </button>

            ) : (

              <div style={styles.scheduleBox}>

                <div style={styles.scheduleHeader}>

                  <strong>
                    اليوم الثاني
                  </strong>

                  <button
                    type="button"
                    style={styles.removeDayBtn}
                    onClick={removeSecondDay}
                  >
                    إزالة
                  </button>

                </div>


                <div style={styles.dayGrid}>

                  {DAYS.map(d => (

                    <button
                      type="button"
                      key={d.id}
                      style={{
                        ...styles.smallPill,
                        ...(schedule[1]?.day === d.id
                          ? styles.pillActive
                          : {})
                      }}
                      onClick={() =>
                        updateSchedule(
                          1,
                          "day",
                          d.id
                        )
                      }
                    >
                      {d.name}
                    </button>

                  ))}

                </div>


                {schedule[1]?.day && (

                  <>

                    <label style={styles.miniLabel}>
                      الساعة
                    </label>

                    <div style={styles.dayGrid}>

                      {getDayInfo(
                        schedule[1].day
                      ).times.map(t => (

                        <button
                          type="button"
                          key={t}
                          style={{
                            ...styles.smallPill,
                            ...(schedule[1].time === t
                              ? styles.pillActive
                              : {})
                          }}
                          onClick={() =>
                            updateSchedule(
                              1,
                              "time",
                              t
                            )
                          }
                        >
                          {t}
                        </button>

                      ))}

                    </div>

                  </>

                )}

              </div>

            )}


            {/* SESSIONS */}

            <label style={styles.label}>
              عدد الحصص
            </label>

            <div style={styles.pillRow}>

              {SESSION_OPTIONS.map(n => (

                <button
                  key={n}
                  type="button"
                  style={{
                    ...styles.pill,
                    ...(sessions === n
                      ? styles.pillActive
                      : {})
                  }}
                  onClick={() =>
                    setSessions(n)
                  }
                >
                  {n} حصص
                </button>

              ))}

            </div>


            {/* DATES */}

            <div style={styles.row2}>

              <div style={{flex:1}}>

                <label style={styles.label}>
                  بداية الاشتراك
                </label>

                <input
                  type="date"
                  style={styles.input}
                  value={startDate}
                  onChange={
                    e => setStartDate(
                      e.target.value
                    )
                  }
                />

              </div>


              <div style={{flex:1}}>

                <label style={styles.label}>
                  نهاية الاشتراك
                </label>

                <input
                  type="date"
                  style={styles.input}
                  value={endDate}
                  onChange={
                    e => setEndDate(
                      e.target.value
                    )
                  }
                />

              </div>

            </div>


            {/* AMOUNT */}

            <label style={styles.label}>
              المبلغ
            </label>

            <input
              style={styles.input}
              value={amount}
              onChange={
                e => setAmount(e.target.value)
              }
              placeholder="مثال: 700 جنيه"
            />


            {/* PAID */}

            <label style={styles.checkRow}>

              <input
                type="checkbox"
                checked={paid}
                onChange={
                  e => setPaid(
                    e.target.checked
                  )
                }
                style={styles.checkbox}
              />

              تم الدفع

            </label>


            {/* NOTES */}

            <label style={styles.label}>
              ملاحظات
            </label>

            <textarea
              style={{
                ...styles.input,
                minHeight:70,
                resize:"vertical"
              }}
              value={notes}
              onChange={
                e => setNotes(e.target.value)
              }
              placeholder="أي تفاصيل إضافية"
            />


            <button
              type="submit"
              style={styles.submitBtn}
            >
              حفظ الاشتراك
            </button>

          </form>

        )}


        {/* =========================
            GROUPS
        ========================= */}

        {tab === "groups" && (

          <div>

            {loading ? (

              <div style={styles.empty}>
                بيتم التحميل...
              </div>

            ) : (

              <>

                {!viewDay && !archiveOpen && (

                  <>

                    <div style={styles.groupTopBar}>

                      <span style={styles.display}>
                        المجاميع
                      </span>

                      <button
                        style={styles.archiveBtn}
                        onClick={() =>
                          setArchiveOpen(true)
                        }
                      >
                        🗄 الأرشيف
                        <span style={styles.archiveCount}>
                          {archive.length}
                        </span>
                      </button>

                    </div>


                    <div style={styles.groupGrid}>

                      {DAYS.map(d => {

                        const dayBookings =
                          bookings.filter(b => {

                            const schedules =
                              b.schedule ||
                              (
                                b.day
                                ? [{
                                  day:b.day,
                                  time:b.time
                                }]
                                : []
                              );

                            return schedules.some(
                              s =>
                                s.day === d.id
                            );

                          });

                        const count =
                          uniqueCount(
                            dayBookings
                          );

                        return (

                          <button
                            key={d.id}
                            style={styles.groupCard}
                            onClick={() =>
                              setViewDay(d.id)
                            }
                          >

                            <div
                              style={
                                styles.groupCardTitle
                              }
                            >
                              {d.name}
                            </div>

                            <div
                              style={
                                styles.groupCardCount
                              }
                            >
                              {count} مشترك فعلي
                            </div>

                          </button>

                        );

                      })}

                    </div>

                  </>

                )}


                {/* ARCHIVE */}

                {archiveOpen && !viewDay && (

                  <>

                    <button
                      style={styles.backBtn}
                      onClick={() =>
                        setArchiveOpen(false)
                      }
                    >
                      → رجوع للمجاميع
                    </button>

                    <div style={styles.listHeader}>

                      <span style={styles.display}>
                        الأرشيف
                      </span>

                    </div>


                    {archive.length === 0 ? (

                      <div style={styles.empty}>
                        الأرشيف فارغ
                      </div>

                    ) : (

                      <div style={styles.list}>

                        {archive.map(b => (

                          <div
                            key={b.id}
                            style={styles.bookingCard}
                          >

                            <div
                              style={styles.bookingBody}
                            >

                              <div
                                style={styles.bookingTop}
                              >

                                <span
                                  style={
                                    styles.bookingName
                                  }
                                >
                                  {b.name}
                                </span>

                                <button
                                  style={
                                    styles.permanentDeleteBtn
                                  }
                                  onClick={() =>
                                    permanentlyDeleteArchive(
                                      b.id
                                    )
                                  }
                                >
                                  حذف نهائي
                                </button>

                              </div>


                              <div
                                style={
                                  styles.bookingPhone
                                }
                              >
                                {b.phone}
                              </div>


                              <div
                                style={
                                  styles.metaRow
                                }
                              >

                                <span
                                  style={
                                    styles.metaTag
                                  }
                                >
                                  {b.sessions} حصص
                                </span>

                                <span
                                  style={
                                    styles.metaTag
                                  }
                                >
                                  {b.amount}
                                </span>

                              </div>


                              <div
                                style={
                                  styles.scheduleText
                                }
                              >

                                {(b.schedule || []).map(
                                  (s,i) => {

                                    const info =
                                      getDayInfo(
                                        s.day
                                      );

                                    return (
                                      <span
                                        key={i}
                                        style={
                                          styles.scheduleTag
                                        }
                                      >
                                        {info?.name}{" "}
                                        {s.time}
                                      </span>
                                    );

                                  }
                                )}

                              </div>


                              {b.notes && (

                                <div
                                  style={
                                    styles.notesText
                                  }
                                >
                                  {b.notes}
                                </div>

                              )}

                            </div>

                          </div>

                        ))}

                      </div>

                    )}

                  </>

                )}


                {/* SELECT DAY */}

                {viewDay && !viewTime && (

                  <>

                    <button
                      style={styles.backBtn}
                      onClick={() =>
                        setViewDay(null)
                      }
                    >
                      → رجوع للمجاميع
                    </button>

                    <div style={styles.listHeader}>

                      <span style={styles.display}>
                        {getDayInfo(viewDay).name}
                        {" "}— اختار الساعة
                      </span>

                    </div>


                    <div style={styles.groupGrid}>

                      {getDayInfo(viewDay)
                        .times
                        .map(t => {

                          const members =
                            groupMembers(
                              viewDay,
                              t
                            );

                          const count =
                            uniqueCount(
                              members
                            );

                          return (

                            <button
                              key={t}
                              style={
                                styles.groupCard
                              }
                              onClick={() =>
                                setViewTime(t)
                              }
                            >

                              <div
                                style={
                                  styles.groupCardTitle
                                }
                              >
                                {t}
                              </div>

                              <div
                                style={
                                  styles.groupCardCount
                                }
                              >
                                {count} مشترك فعلي
                              </div>

                            </button>

                          );

                        })}

                    </div>

                  </>

                )}


                {/* SELECT TIME */}

                {viewDay && viewTime && (

                  <>

                    <button
                      style={styles.backBtn}
                      onClick={() =>
                        setViewTime(null)
                      }
                    >
                      → رجوع للساعات
                    </button>

                    <div style={styles.listHeader}>

                      <span style={styles.display}>
                        {getDayInfo(viewDay).name}
                        {" "}— {viewTime}
                      </span>

                    </div>


                    {groupMembers(
                      viewDay,
                      viewTime
                    ).length === 0 ? (

                      <div style={styles.empty}>
                        مفيش متدربين في المجموعة دي
                      </div>

                    ) : (

                      <div style={styles.list}>

                        {groupMembers(
                          viewDay,
                          viewTime
                        ).map(b => (

                          <BookingCard
                            key={b.id}
                            booking={b}
                            onArchive={
                              archiveBooking
                            }
                            onEditNotes={
                              editNotes
                            }
                            onAttendance={
                              updateAttendance
                            }
                          />

                        ))}

                      </div>

                    )}

                  </>

                )}

              </>

            )}

          </div>

        )}

      </div>


      {toast && (

        <div style={styles.toast}>
          {toast}
        </div>

      )}

    </div>

  );

}

  const schedule =
    booking.schedule ||
    (
      booking.day

        day:booking.day,
        time:booking.time
      }]
      : []
    );

  const attendance =
    booking.attendance || [];


  return (

    <div style={styles.bookingCard}>

      <div style={styles.bookingBody}>

          <span style={styles.bookingName}>
            {booking.name}

                  style={{
