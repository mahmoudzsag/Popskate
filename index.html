<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Popskate - نظام الحجوزات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; }
  h1, .display { font-family: 'Cairo', sans-serif; }
  body { background: #F4F1EA; color: #2B2822; }
  button { cursor: pointer; border: none; font-family: inherit; }
  input, select, textarea { font-family: inherit; }
  ::placeholder { color: #9A9591; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getDatabase, ref, onValue, set, push, remove
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDMbm7dpYeop4MJAXBtC6J6sNQYvHU8WZw",
    authDomain: "popskate-480e5.firebaseapp.com",
    databaseURL: "https://popskate-480e5-default-rtdb.firebaseio.com",
    projectId: "popskate-480e5",
    storageBucket: "popskate-480e5.firebasestorage.app",
    messagingSenderId: "849168464452",
    appId: "1:849168464452:web:0e70ef682616ab50389a11",
    measurementId: "G-WH6PF04R2J"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const bookingsRef = ref(db, 'bookings');
  const archiveRef = ref(db, 'archive');

  window.__firebase = { db, ref, onValue, set, push, remove, bookingsRef, archiveRef };
</script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo } = React;

const LOGO_URL = "https://i.ibb.co/gMQ0KfwD/IMG-20260313-164930.jpg";

const DAYS = [
  { id: 'sat', name: 'السبت', times: ['3:00', '4:00', '5:00', '6:00', '7:00', '8:00', '9:00'] },
  { id: 'sun', name: 'الأحد', times: ['12:00', '1:00', '2:00', '3:00'] },
  { id: 'mon', name: 'الاتنين', times: ['3:00', '4:00', '5:00', '6:00', '7:00', '8:00', '9:00'] },
  { id: 'tue', name: 'الثلاثاء', times: ['12:00', '1:00', '2:00', '3:00'] },
  { id: 'wed', name: 'الأربع', times: ['3:00', '4:00', '5:00', '6:00', '7:00', '8:00', '9:00'] },
  { id: 'thu', name: 'الخميس', times: ['3:00', '4:00', '5:00', '6:00', '7:00', '8:00', '9:00'] },
];

const SESSION_OPTIONS = [4, 8, 12, 16];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function makeAttendance(sessionsCount, slots) {
  if (!slots || slots.length === 0) return [];
  const perDay = Math.floor(sessionsCount / slots.length);
  const remainder = sessionsCount % slots.length;
  return slots.map((slot, slotIdx) => {
    const daySessions = perDay + (slotIdx < remainder ? 1 : 0);
    const slotsCount = Math.ceil(daySessions / 4);
    return {
      day: slot.day,
      time: slot.time,
      sessionsForDay: daySessions,
      checkpoints: Array.from({ length: slotsCount }, (_, i) => ({
        index: i + 1,
        status: null,
        excuseReason: '',
      })),
    };
  });
}

function PopskateApp() {
  const [tab, setTab] = useState('form');
  const [bookings, setBookings] = useState([]);
  const [archive, setArchive] = useState([]);
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);
  const [toast, setToast] = useState(null);

  // form state
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [selectedSlots, setSelectedSlots] = useState([]);
  const [amount, setAmount] = useState('');
  const [paid, setPaid] = useState(false);
  const [sessions, setSessions] = useState(null);
  const [startDate, setStartDate] = useState(todayStr());
  const [endDate, setEndDate] = useState('');
  const [notes, setNotes] = useState('');
  const [errors, setErrors] = useState({});
  const [phoneMatch, setPhoneMatch] = useState(null);

  // groups view state
  const [viewDay, setViewDay] = useState(null);
  const [viewTime, setViewTime] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [confirmArchiveDeleteId, setConfirmArchiveDeleteId] = useState(null);
  const [excuseModal, setExcuseModal] = useState(null);
  const [excuseText, setExcuseText] = useState('');
  const [showUnpaidModal, setShowUnpaidModal] = useState(false);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  useEffect(() => {
    const { onValue, bookingsRef, archiveRef } = window.__firebase;
    const unsub1 = onValue(bookingsRef, (snapshot) => {
      const data = snapshot.val();
      const list = data
        ? Object.entries(data).map(([id, val]) => ({ id, ...val })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
        : [];
      setBookings(list);
      setLoading(false);
    }, (error) => {
      setLoading(false);
      showToast('خطأ اتصال: ' + error.message);
    });
    const unsub2 = onValue(archiveRef, (snapshot) => {
      const data = snapshot.val();
      const list = data
        ? Object.entries(data).map(([id, val]) => ({ id, ...val })).sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0))
        : [];
      setArchive(list);
    }, (error) => {
      showToast('خطأ اتصال بالأرشيف: ' + error.message);
    });
    return () => { unsub1(); unsub2(); };
  }, []);

  useEffect(() => {
    const cleaned = phone.trim();
    if (cleaned.length < 6) { setPhoneMatch(null); return; }
    const activeMatch = bookings.find((b) => b.phone === cleaned);
    const archiveMatch = !activeMatch ? archive.find((b) => b.phone === cleaned) : null;
    setPhoneMatch(activeMatch ? { ...activeMatch, source: 'active' } : archiveMatch ? { ...archiveMatch, source: 'archive' } : null);
  }, [phone, bookings, archive]);

  const fillFromMatch = () => {
    if (!phoneMatch) return;
    setName(phoneMatch.name || '');
    showToast('تم استدعاء بيانات العميل');
  };

  const resetForm = () => {
    setName('');
    setPhone('');
    setSelectedSlots([]);
    setAmount('');
    setPaid(false);
    setSessions(null);
    setStartDate(todayStr());
    setEndDate('');
    setNotes('');
    setErrors({});
    setPhoneMatch(null);
  };

  const toggleSlot = (dayId, time) => {
    setSelectedSlots((prev) => {
      const exists = prev.find((s) => s.day === dayId && s.time === time);
      if (exists) return prev.filter((s) => !(s.day === dayId && s.time === time));
      return [...prev, { day: dayId, time }];
    });
  };

  const validate = () => {
    const e = {};
    const missing = [];
    if (!name.trim()) { e.name = true; missing.push('الاسم'); }
    if (!phone.trim()) { e.phone = true; missing.push('الموبايل'); }
    if (selectedSlots.length === 0) { e.slots = true; missing.push('اليوم والساعة'); }
    if (!amount.trim()) { e.amount = true; missing.push('المبلغ'); }
    if (!sessions) { e.sessions = true; missing.push('عدد الحصص'); }
    if (!startDate) { e.startDate = true; missing.push('تاريخ البداية'); }
    if (!endDate) { e.endDate = true; missing.push('تاريخ النهاية'); }
    setErrors(e);
    return { valid: Object.keys(e).length === 0, missing };
  };

  const submitBooking = async (ev) => {
    ev.preventDefault();
    try {
      const { valid, missing } = validate();
      if (!valid) {
        showToast('محتاج تملى: ' + missing.join('، '));
        return;
      }
      setSyncing(true);
      const { push, set, bookingsRef } = window.__firebase;
      const newRef = push(bookingsRef);
      await set(newRef, {
        name: name.trim(),
        phone: phone.trim(),
        slots: selectedSlots,
        amount: amount.trim(),
        paid,
        sessions,
        startDate,
        endDate,
        notes: notes.trim(),
        attendance: makeAttendance(sessions, selectedSlots),
        createdAt: Date.now(),
      });
      showToast('تم تسجيل الاشتراك بنجاح');
      resetForm();
    } catch (err) {
      showToast('حصل خطأ: ' + (err && err.message ? err.message : 'جرب تاني'));
    }
    setSyncing(false);
  };

  const updateBooking = async (id, patch) => {
    const { ref, set, db } = window.__firebase;
    const booking = bookings.find((b) => b.id === id);
    if (!booking) return;
    const bookingRef = ref(db, `bookings/${id}`);
    setSyncing(true);
    try {
      const { id: _drop, ...rest } = booking;
      await set(bookingRef, { ...rest, ...patch });
    } catch (err) {
      showToast('حصل خطأ في التحديث');
    }
    setSyncing(false);
  };

  const togglePaid = (id, currentPaid) => updateBooking(id, { paid: !currentPaid });
  const updateNotes = (id, newNotes) => updateBooking(id, { notes: newNotes });

  const setAttendance = (id, day, time, checkpointIndex, status, excuseReason) => {
    const booking = bookings.find((b) => b.id === id);
    if (!booking) return;
    const attendance = (booking.attendance || []).map((dayBlock) => {
      if (dayBlock.day !== day || dayBlock.time !== time) return dayBlock;
      return {
        ...dayBlock,
        checkpoints: dayBlock.checkpoints.map((c) =>
          c.index === checkpointIndex ? { ...c, status, excuseReason: status === 'excused' ? (excuseReason || '') : '' } : c
        ),
      };
    });
    updateBooking(id, { attendance });
  };

  const handleAttendanceClick = (bookingId, day, time, checkpointIndex, status) => {
    if (status === 'excused') {
      setExcuseText('');
      setExcuseModal({ bookingId, day, time, checkpointIndex });
    } else {
      setAttendance(bookingId, day, time, checkpointIndex, status);
    }
  };

  const confirmExcuse = () => {
    if (!excuseModal) return;
    setAttendance(excuseModal.bookingId, excuseModal.day, excuseModal.time, excuseModal.checkpointIndex, 'excused', excuseText.trim());
    setExcuseModal(null);
  };

  const archiveBooking = async (id) => {
    const { ref, set, remove, db, archiveRef, push } = window.__firebase;
    const booking = bookings.find((b) => b.id === id);
    if (!booking) return;
    setSyncing(true);
    try {
      const { id: _drop, ...rest } = booking;
      const newArchiveRef = push(archiveRef);
      await set(newArchiveRef, { ...rest, archivedAt: Date.now() });
      await remove(ref(db, `bookings/${id}`));
      showToast('تم نقل الاشتراك للأرشيف');
    } catch (err) {
      showToast('خطأ في الأرشفة: ' + (err && err.message ? err.message : 'غير معروف'));
    }
    setSyncing(false);
    setConfirmDeleteId(null);
  };

  const deleteFromArchive = async (id) => {
    const { ref, remove, db } = window.__firebase;
    setSyncing(true);
    try {
      await remove(ref(db, `archive/${id}`));
      showToast('تم حذف الاشتراك نهائيًا من الأرشيف');
    } catch (err) {
      showToast('حصل خطأ في الحذف');
    }
    setSyncing(false);
    setConfirmArchiveDeleteId(null);
  };

  const dayInfo = (id) => DAYS.find((d) => d.id === id);

  const groupMembers = (dId, t) =>
    bookings.filter((b) => (b.slots || []).some((s) => s.day === dId && s.time === t));

  const uniqueCountForDay = (dId) => {
    const phones = new Set(
      bookings.filter((b) => (b.slots || []).some((s) => s.day === dId)).map((b) => b.phone)
    );
    return phones.size;
  };

  const uniqueCountForSlot = (dId, t) => {
    const phones = new Set(groupMembers(dId, t).map((b) => b.phone));
    return phones.size;
  };

  // تجميع الإحصائيات الشاملة حسب رقم الهاتف (المشتركين الفريدين)
  const totals = useMemo(() => {
    const uniqueMap = new Map();
    bookings.forEach((b) => {
      const phone = (b.phone || '').trim();
      if (!phone) return;
      if (!uniqueMap.has(phone)) {
        uniqueMap.set(phone, b);
      } else {
        // لو مشترك واحد له أكتر من حجز وعنده حجز واحد مدفوع نعتبره دافع
        const existing = uniqueMap.get(phone);
        if (!existing.paid && b.paid) {
          uniqueMap.set(phone, b);
        }
      }
    });

    const uniqueList = Array.from(uniqueMap.values());
    const totalBookings = uniqueList.length;
    const paidCount = uniqueList.filter((b) => b.paid).length;
    const unpaidList = uniqueList.filter((b) => !b.paid);

    return {
      totalBookings,
      paidCount,
      unpaidCount: unpaidList.length,
      unpaidList,
    };
  }, [bookings]);

  return (
    <div dir="rtl" style={styles.page}>
      <header style={styles.header}>
        <div style={styles.headerInner}>
          <div style={styles.logoRow}>
            <img src={LOGO_URL} alt="Popskate" style={styles.logoMark} />
            <div>
              <h1 style={styles.title}>Popskate</h1>
              <div style={styles.subtitle}>نظام حجوزات مركز السكيت</div>
            </div>
          </div>
          <div style={styles.syncBadge}>
            <span style={{ ...styles.syncDot, background: syncing ? '#E8A33D' : '#3BA776' }} />
            {syncing ? 'بيتم الحفظ...' : 'متزامن'}
          </div>
        </div>
        <div style={styles.tabs}>
          <button style={{ ...styles.tabBtn, ...(tab === 'form' ? styles.tabBtnActive : {}) }} onClick={() => setTab('form')}>+ اشتراك جديد</button>
          <button style={{ ...styles.tabBtn, ...(tab === 'groups' ? styles.tabBtnActive : {}) }} onClick={() => { setTab('groups'); setViewDay(null); setViewTime(null); }}>المجاميع</button>
          <button style={{ ...styles.tabBtn, ...(tab === 'archive' ? styles.tabBtnActive : {}) }} onClick={() => setTab('archive')}>الأرشيف</button>
        </div>
      </header>

      <div style={styles.content}>
        {tab === 'form' && (
          <form onSubmit={submitBooking} style={styles.formCard}>
            <label style={styles.label}>اسم المتدرب</label>
            <input style={{ ...styles.input, ...(errors.name ? styles.inputError : {}) }} value={name} onChange={(e) => setName(e.target.value)} placeholder="مثال: يوسف أحمد" />

            <label style={styles.label}>رقم الموبايل</label>
            <input style={{ ...styles.input, ...(errors.phone ? styles.inputError : {}) }} value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="01xxxxxxxxx" type="tel" />

            {phoneMatch && (
              <div style={styles.matchBox}>
                <div style={styles.matchText}>
                  ⚠️ الرقم ده موجود قبل كده {phoneMatch.source === 'archive' ? 'في الأرشيف' : 'في اشتراك حالي'} باسم "{phoneMatch.name}"
                </div>
                <button type="button" style={styles.matchBtn} onClick={fillFromMatch}>استدعاء البيانات</button>
              </div>
            )}

            <label style={styles.label}>الأيام والمواعيد (ممكن تختار أكتر من موعد)</label>
            <div style={{ ...styles.daysBox, ...(errors.slots && selectedSlots.length === 0 ? styles.inputError : {}) }}>
              {DAYS.map((d) => (
                <div key={d.id} style={styles.dayBlock}>
                  <div style={styles.dayBlockTitle}>{d.name}</div>
                  <div style={styles.pillRow}>
                    {d.times.map((t) => {
                      const active = selectedSlots.some((s) => s.day === d.id && s.time === t);
                      return (
                        <button key={t} type="button" style={{ ...styles.pillSmall, ...(active ? styles.pillActive : {}) }} onClick={() => toggleSlot(d.id, t)}>
                          {t}
                        </button>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>

            <label style={styles.label}>عدد الحصص</label>
            <div style={styles.pillRow}>
              {SESSION_OPTIONS.map((n) => (
                <button key={n} type="button" style={{ ...styles.pill, ...(sessions === n ? styles.pillActive : {}), ...(errors.sessions && !sessions ? styles.pillError : {}) }} onClick={() => setSessions(n)}>
                  {n} حصص
                </button>
              ))}
            </div>

            <div style={styles.row2}>
              <div style={{ flex: 1 }}>
                <label style={styles.label}>بداية الاشتراك</label>
                <input type="date" style={{ ...styles.input, ...(errors.startDate ? styles.inputError : {}) }} value={startDate} onChange={(e) => setStartDate(e.target.value)} />
              </div>
              <div style={{ flex: 1 }}>
                <label style={styles.label}>نهاية الاشتراك</label>
                <input type="date" style={{ ...styles.input, ...(errors.endDate ? styles.inputError : {}) }} value={endDate} onChange={(e) => setEndDate(e.target.value)} />
              </div>
            </div>

            <label style={styles.label}>المبلغ</label>
            <input style={{ ...styles.input, ...(errors.amount ? styles.inputError : {}) }} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="مثال: 300 جنيه" />

            <label style={styles.checkRow}>
              <input type="checkbox" checked={paid} onChange={(e) => setPaid(e.target.checked)} style={styles.checkbox} />
              تم الدفع
            </label>

            <label style={styles.label}>ملاحظات (اختياري)</label>
            <textarea style={{ ...styles.input, minHeight: 60, resize: 'vertical' }} value={notes} onChange={(e) => setNotes(e.target.value)} placeholder="أي تفاصيل إضافية" />

            <button type="submit" style={styles.submitBtn}>حفظ الاشتراك</button>
          </form>
        )}

        {tab === 'groups' && (
          <div>
            {loading ? (
              <div style={styles.empty}>بيتم التحميل...</div>
            ) : !viewDay ? (
              <>
                <div style={styles.listHeader}><span style={styles.display}>اختار اليوم</span></div>
                <div style={styles.groupGrid}>
                  {DAYS.map((d) => (
                    <button key={d.id} style={styles.groupCard} onClick={() => setViewDay(d.id)}>
                      <div style={styles.groupCardTitle}>{d.name}</div>
                      <div style={styles.groupCardCount}>{uniqueCountForDay(d.id)} متدرب</div>
                    </button>
                  ))}
                </div>

                {/* كروت المجاميع والإحصائيات العامة بالأسفل */}
                <div style={styles.statsContainer}>
                  <div style={styles.statCard}>
                    <div style={{ ...styles.statNumber, color: '#2B2822' }}>{totals.totalBookings}</div>
                    <div style={styles.statLabel}>إجمالي الحجوزات</div>
                  </div>
                  <div style={styles.statCard}>
                    <div style={{ ...styles.statNumber, color: '#3BA776' }}>{totals.paidCount}</div>
                    <div style={styles.statLabel}>تم الدفع</div>
                  </div>
                  <button style={{ ...styles.statCard, ...styles.statBtn }} onClick={() => setShowUnpaidModal(true)}>
                    <div style={{ ...styles.statNumber, color: '#C0392B' }}>{totals.unpaidCount}</div>
                    <div style={styles.statLabel}>لسه هيدفع</div>
                  </button>
                </div>
              </>
            ) : !viewTime ? (
              <>
                <button style={styles.backBtn} onClick={() => setViewDay(null)}>→ رجوع لليوم</button>
                <div style={styles.listHeader}><span style={styles.display}>{dayInfo(viewDay).name} — اختار الساعة</span></div>
                <div style={styles.groupGrid}>
                  {dayInfo(viewDay).times.map((t) => (
                    <button key={t} style={styles.groupCard} onClick={() => setViewTime(t)}>
                      <div style={styles.groupCardTitle}>{t}</div>
                      <div style={styles.groupCardCount}>{uniqueCountForSlot(viewDay, t)} متدرب</div>
                    </button>
                  ))}
                </div>
              </>
            ) : (
              <>
                <button style={styles.backBtn} onClick={() => setViewTime(null)}>→ رجوع للساعات</button>
                <div style={styles.listHeader}><span style={styles.display}>{dayInfo(viewDay).name} — {viewTime}</span></div>
                {groupMembers(viewDay, viewTime).length === 0 ? (
                  <div style={styles.empty}>مفيش متدربين في المجموعة دي لسه</div>
                ) : (
                  <div style={styles.list}>
                    {groupMembers(viewDay, viewTime).map((b) => (
                      <div key={b.id} style={styles.bookingCard}>
                        <div style={styles.bookingBody}>
                          <div style={styles.bookingTop}>
                            <span style={styles.bookingName}>{b.name}</span>
                            <button style={styles.archiveBtn} onClick={() => setConfirmDeleteId(b.id)}>نقل للأرشيف</button>
                          </div>
                          <div style={styles.bookingPhone}>{b.phone}</div>
                          <div style={styles.metaRow}>
                            <span style={styles.metaTag}>{b.sessions} حصص</span>
                            <span style={styles.metaTag}>{b.startDate} → {b.endDate}</span>
                          </div>
                          {(b.slots || []).length > 1 && (
                            <div style={styles.metaRow}>
                              {b.slots.map((s, i) => (
                                <span key={i} style={styles.metaTagAlt}>{dayInfo(s.day) ? dayInfo(s.day).name : s.day} {s.time}</span>
                              ))}
                            </div>
                          )}
                          <div style={styles.amountText}>المبلغ: {b.amount}</div>

                          <label style={{ ...styles.label, marginTop: 10 }}>ملاحظات</label>
                          <textarea
                            style={{ ...styles.input, minHeight: 44, fontSize: 12 }}
                            value={b.notes || ''}
                            onChange={(e) => updateNotes(b.id, e.target.value)}
                            placeholder="تعديل الملاحظات..."
                          />

                          <button
                            style={{
                              ...styles.paidBtn,
                              background: b.paid ? '#3BA77622' : '#F4F1EA',
                              color: b.paid ? '#3BA776' : '#9A9591',
                              border: b.paid ? '1px solid #3BA77655' : '1px solid #E5E0D8',
                            }}
                            onClick={() => togglePaid(b.id, b.paid)}
                          >
                            {b.paid ? '✓ تم الدفع' : 'لسه هيدفع'}
                          </button>

                          <label style={{ ...styles.label, marginTop: 12 }}>الحضور — {dayInfo(viewDay).name} {viewTime}</label>
                          <div style={styles.attendanceGrid}>
                            {(() => {
                              const dayBlock = (b.attendance || []).find((a) => a.day === viewDay && a.time === viewTime);
                              if (!dayBlock || !dayBlock.checkpoints) {
                                return <div style={styles.empty}>مفيش بيانات حضور لليوم ده لسه</div>;
                              }
                              return dayBlock.checkpoints.map((c) => (
                                <div key={c.index} style={styles.attendanceSlot}>
                                  <div style={styles.attendanceSlotTitle}>حصص {(c.index - 1) * 4 + 1}-{c.index * 4}</div>
                                  <div style={styles.attendanceBtnRow}>
                                    <button
                                      type="button"
                                      style={{ ...styles.attBtn, ...(c.status === 'present' ? styles.attBtnPresent : {}) }}
                                      onClick={() => handleAttendanceClick(b.id, viewDay, viewTime, c.index, 'present')}
                                    >حضور</button>
                                    <button
                                      type="button"
                                      style={{ ...styles.attBtn, ...(c.status === 'absent' ? styles.attBtnAbsent : {}) }}
                                      onClick={() => handleAttendanceClick(b.id, viewDay, viewTime, c.index, 'absent')}
                                    >غياب</button>
                                    <button
                                      type="button"
                                      style={{ ...styles.attBtn, ...(c.status === 'excused' ? styles.attBtnExcused : {}) }}
                                      onClick={() => handleAttendanceClick(b.id, viewDay, viewTime, c.index, 'excused')}
                                    >اعتذار</button>
                                  </div>
                                  {c.status === 'excused' && c.excuseReason && (
                                    <div style={styles.excuseNote}>السبب: {c.excuseReason}</div>
                                  )}
                                </div>
                              ));
                            })()}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {tab === 'archive' && (
          <div>
            <div style={styles.listHeader}><span style={styles.display}>الأرشيف</span></div>
            {archive.length === 0 ? (
              <div style={styles.empty}>الأرشيف فاضي دلوقتي</div>
            ) : (
              <div style={styles.list}>
                {archive.map((b) => (
                  <div key={b.id} style={styles.bookingCard}>
                    <div style={styles.bookingBody}>
                      <div style={styles.bookingTop}>
                        <span style={styles.bookingName}>{b.name}</span>
                        <button style={styles.deleteBtn} onClick={() => setConfirmArchiveDeleteId(b.id)}>✕</button>
                      </div>
                      <div style={styles.bookingPhone}>{b.phone}</div>
                      <div style={styles.metaRow}>
                        <span style={styles.metaTag}>{b.sessions} حصص</span>
                        <span style={styles.metaTag}>{b.startDate} → {b.endDate}</span>
                      </div>
                      {(b.slots || []).map((s, i) => (
                        <span key={i} style={styles.metaTagAlt}>{dayInfo(s.day) ? dayInfo(s.day).name : s.day} {s.time}</span>
                      ))}
                      <div style={styles.amountText}>المبلغ: {b.amount} — {b.paid ? 'تم الدفع' : 'لم يدفع'}</div>
                      {b.notes && <div style={styles.notesText}>{b.notes}</div>}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>

      {/* نافذة عرض المتدربين الذين لم يدفعوا بعد */}
      {showUnpaidModal && (
        <div style={styles.modalOverlay}>
          <div style={{ ...styles.modalBox, maxWidth: 400, maxHeight: '80vh', overflowY: 'auto' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
              <div style={styles.modalTitle}>المشتركين (لسه هيدفع)</div>
              <button style={{ background: 'none', fontSize: 18, fontWeight: 'bold' }} onClick={() => setShowUnpaidModal(false)}>✕</button>
            </div>
            {totals.unpaidList.length === 0 ? (
              <div style={styles.empty}>كل المشتركين تم الدفع لهم 👍</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {totals.unpaidList.map((item) => (
                  <div key={item.id} style={{ background: '#FAF8F4', padding: 12, borderRadius: 10, border: '1px solid #E5E0D8' }}>
                    <div style={{ fontWeight: 700, fontSize: 14 }}>{item.name}</div>
                    <div style={{ fontSize: 12, color: '#7A756D', marginTop: 2, direction: 'ltr', textAlign: 'right' }}>{item.phone}</div>
                    <div style={{ fontSize: 12, color: '#C0392B', marginTop: 4, fontWeight: 600 }}>المبلغ: {item.amount}</div>
                  </div>
                ))}
              </div>
            )}
            <button style={{ ...styles.modalCancel, width: '100%', marginTop: 16 }} onClick={() => setShowUnpaidModal(false)}>إغلاق</button>
          </div>
        </div>
      )}

      {/* تأكيد نقل للأرشيف */}
      {confirmDeleteId && (
        <div style={styles.modalOverlay}>
          <div style={styles.modalBox}>
            <div style={styles.modalTitle}>نقل الاشتراك للأرشيف؟</div>
            <div style={styles.modalText}>هيتشال من المجموعة الحالية ويتحفظ في الأرشيف.</div>
            <div style={styles.modalActions}>
              <button style={styles.modalCancel} onClick={() => setConfirmDeleteId(null)}>إلغاء</button>
              <button style={styles.modalConfirm} onClick={() => archiveBooking(confirmDeleteId)}>نقل للأرشيف</button>
            </div>
          </div>
        </div>
      )}

      {/* تأكيد حذف نهائي من الأرشيف */}
      {confirmArchiveDeleteId && (
        <div style={styles.modalOverlay}>
          <div style={styles.modalBox}>
            <div style={styles.modalTitle}>حذف نهائي من الأرشيف؟</div>
            <div style={styles.modalText}>مينفعش ترجع البيانات دي تاني بعد الحذف.</div>
            <div style={styles.modalActions}>
              <button style={styles.modalCancel} onClick={() => setConfirmArchiveDeleteId(null)}>إلغاء</button>
              <button style={styles.modalConfirmDanger} onClick={() => deleteFromArchive(confirmArchiveDeleteId)}>حذف نهائي</button>
            </div>
          </div>
        </div>
      )}

      {/* نافذة سبب الاعتذار */}
      {excuseModal && (
        <div style={styles.modalOverlay}>
          <div style={styles.modalBox}>
            <div style={styles.modalTitle}>سبب الاعتذار</div>
            <textarea
              autoFocus
              style={{ ...styles.input, minHeight: 70, marginTop: 10 }}
              value={excuseText}
              onChange={(e) => setExcuseText(e.target.value)}
              placeholder="اكتب سبب الاعتذار..."
            />
            <div style={styles.modalActions}>
              <button style={styles.modalCancel} onClick={() => setExcuseModal(null)}>إلغاء</button>
              <button style={styles.modalConfirm} onClick={confirmExcuse}>حفظ</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div style={styles.toast}>{toast}</div>}
    </div>
  );
}
